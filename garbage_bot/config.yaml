name: "GarbageBot WhatsApp"
version: "1.0.7-b3"
slug: "garbagebot_whatsapp"
description: "Bot WhatsApp per gestione automatica turni spazzatura e calendario con integrazione Google Sheets"
url: "https://github.com/vladbragoi/garbage-bot"
documentation: "https://github.com/vladbragoi/garbage-bot/blob/main/garbage_bot/INSTALL_HOMEASSISTANT.md"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto

# Home Assistant folder mapping
map:
  - config:ro  # Legge credentials.json dalla cartella /config di HA
  - data:rw    # Salva database e configurazioni in /data

options:
  log_level: "info"
  telegram_token: ""
  telegram_chat_id: ""
  bot_mobile_number: ""

schema:
  telegram_token: "str"
  telegram_chat_id: "str"
  log_level: "list(debug|info|warning|error)"
  bot_mobile_number: "str"