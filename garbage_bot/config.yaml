name: "GarbageBot WhatsApp"
version: "1.0.6-b3"
slug: "garbagebot_whatsapp"
description: "Bot per la gestione dei turni dei bidoni via WhatsApp su Google Sheets"
arch:
  - aarch64
  - amd64
  - armv7
startup: application
boot: auto
# Mappiamo la cartella /config di Home Assistant in sola lettura (ro)
# così il bot può leggere il credentials.json inserito dall'utente.
map:
  - config:ro
options:
  log_level: "info"
  telegram_token: ""
  telegram_chat_id: ""
  bot_mobile_number: ""

schema:
  telegram_token: "str"
  telegram_chat_id: "str"
  log_level: "list(debug|info|warning|error)"
  bot_mobile_number: "str"